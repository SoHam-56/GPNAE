<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='470' viewBox='0 0 1180 470'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#374151'/></marker></defs><rect x='0' y='0' width='1180' height='470' rx='12' fill='#ffffff'/><text x='590' y='34' font-family='Helvetica, Arial, sans-serif' font-size='16' font-weight='bold' fill='#1f2937' text-anchor='middle'>GPNAE lane (gpnae_poly): one activation per input, many inputs in flight</text><rect x='20' y='150' width='110' height='80' rx='10' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.6'/><text x='75' y='182' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>inputs x</text><text x='75' y='200' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>+ activation</text><rect x='165' y='140' width='130' height='100' rx='10' fill='#e0e7ff' stroke='#4f46e5' stroke-width='1.6'/><text x='230' y='172' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>Range check</text><text x='230' y='196' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>inside the fit</text><text x='230' y='214' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>or past it?</text><polyline points='130,190 163,190' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><rect x='335' y='70' width='360' height='150' rx='10' fill='#dcfce7' stroke='#16a34a' stroke-width='1.6'/><text x='515' y='98' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>Barrel MAC: fitted polynomial P(x)</text><text x='515' y='124' font-family='Helvetica, Arial, sans-serif' font-size='12.2' font-weight='normal' fill='#1f2937' text-anchor='middle'>Horner's rule, one multiply-add per cycle;</text><text x='515' y='143' font-family='Helvetica, Arial, sans-serif' font-size='12.2' font-weight='normal' fill='#1f2937' text-anchor='middle'>up to K inputs interleaved round-robin,</text><text x='515' y='162' font-family='Helvetica, Arial, sans-serif' font-size='12.2' font-weight='normal' fill='#1f2937' text-anchor='middle'>so the multiply-add latency is always filled;</text><text x='515' y='181' font-family='Helvetica, Arial, sans-serif' font-size='12.2' font-weight='normal' fill='#1f2937' text-anchor='middle'>one coefficient table per activation and format</text><rect x='335' y='255' width='360' height='100' rx='10' fill='#fef3c7' stroke='#d97706' stroke-width='1.6'/><text x='515' y='283' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>Tail unit</text><text x='515' y='307' font-family='Helvetica, Arial, sans-serif' font-size='12.2' font-weight='normal' fill='#1f2937' text-anchor='middle'>e^(−|x|) without cancellation, for inputs</text><text x='515' y='326' font-family='Helvetica, Arial, sans-serif' font-size='12.2' font-weight='normal' fill='#1f2937' text-anchor='middle'>past the fit; runs beside the MAC</text><polyline points='295,175 333,150' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><polyline points='295,205 333,300' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><text x='312' y='150' font-family='Helvetica, Arial, sans-serif' font-size='1' font-weight='normal' fill='#1f2937' text-anchor='middle'></text><rect x='735' y='110' width='250' height='200' rx='10' fill='#dbeafe' stroke='#2563eb' stroke-width='1.6'/><text x='860' y='140' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>Shape the result</text><text x='860' y='166' font-family='Helvetica, Arial, sans-serif' font-size='12.2' font-weight='normal' fill='#1f2937' text-anchor='middle'>SELU: λx above 0, P below</text><text x='860' y='187' font-family='Helvetica, Arial, sans-serif' font-size='12.2' font-weight='normal' fill='#1f2937' text-anchor='middle'>sigmoid: P, or 1 − P for x &lt; 0</text><text x='860' y='208' font-family='Helvetica, Arial, sans-serif' font-size='12.2' font-weight='normal' fill='#1f2937' text-anchor='middle'>tanh: x · P(x²), sign of x</text><text x='860' y='229' font-family='Helvetica, Arial, sans-serif' font-size='12.2' font-weight='normal' fill='#1f2937' text-anchor='middle'>ReLU, linear: bypass, exact</text><polyline points='695,150 733,175' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><polyline points='695,305 733,250' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><rect x='1020' y='160' width='140' height='70' rx='10' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.6'/><text x='1090' y='190' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>activation</text><text x='1090' y='208' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>out, in order</text><polyline points='985,195 1018,195' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><rect x='165' y='385' width='850' height='60' rx='10' fill='#f9fafb' stroke='#9ca3af' stroke-width='1.3' stroke-dasharray='6 4'/><text x='590' y='410' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#1f2937' text-anchor='middle'>fp32 and bf16: the same lane at the build's precision.   int8 (gpnae_poly_int8): inputs rescaled to Q4.11 fixed point,</text><text x='590' y='429' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#1f2937' text-anchor='middle'>the same forms evaluated on integers, results requantized to int8 as TFLite does</text></svg>
