<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='500' viewBox='0 0 1180 500'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#374151'/></marker></defs><rect x='0' y='0' width='1180' height='500' rx='12' fill='#ffffff'/><text x='590.0' y='34' font-family='Helvetica, Arial, sans-serif' font-size='16' font-weight='bold' fill='#1f2937' text-anchor='middle'>GPNAE lane: one activation per input, many inputs in flight, coefficients as data</text><rect x='20' y='170' width='110' height='90' rx='10' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.6'/><text x='75.0' y='196' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>inputs x</text><text x='75.0' y='218' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>+ activation</text><text x='75.0' y='235' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>+ accuracy tier</text><rect x='160' y='150' width='190' height='130' rx='10' fill='#e0e7ff' stroke='#4f46e5' stroke-width='1.6'/><text x='255.0' y='176' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>Input stage</text><text x='255.0' y='198' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>|x| picks the piece and</text><text x='255.0' y='215' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>its coefficient set</text><text x='255.0' y='232' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>tanh: x squared</text><text x='255.0' y='249' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>sigmoid x < 0: 2^-n, f</text><text x='255.0' y='266' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>int8: rescale, centre</text><rect x='380' y='150' width='220' height='130' rx='10' fill='#dcfce7' stroke='#16a34a' stroke-width='1.6'/><text x='490.0' y='176' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>Barrel multiply-add</text><text x='490.0' y='198' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>16 inputs take turns:</text><text x='490.0' y='215' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>one Horner step per cycle,</text><text x='490.0' y='232' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>c + x * acc, each input</text><text x='490.0' y='249' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>its own set and degree</text><rect x='630' y='150' width='200' height='130' rx='10' fill='#fef3c7' stroke='#d97706' stroke-width='1.6'/><text x='730.0' y='176' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>Post stage</text><text x='730.0' y='198' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>SELU: lambda x, x P</text><text x='730.0' y='215' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>tanh: x P, sign</text><text x='730.0' y='232' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>sigmoid: P, 1 - P, E(1 - E)</text><text x='730.0' y='249' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>int8: requantize</text><rect x='860' y='170' width='110' height='90' rx='10' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.6'/><text x='915.0' y='196' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>outputs</text><text x='915.0' y='218' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>in input order</text><rect x='380' y='340' width='220' height='120' rx='10' fill='#fce7f3' stroke='#db2777' stroke-width='1.6'/><text x='490.0' y='366' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>Coefficient memory</text><text x='490.0' y='388' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>128 words, per tier and</text><text x='490.0' y='405' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>function: pieces, degree,</text><text x='490.0' y='422' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>base; reset default built in,</text><text x='490.0' y='439' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>the host rewrites it</text><rect x='990' y='150' width='170' height='130' rx='10' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.6'/><text x='1075.0' y='176' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>bf16 only: fp32 tail</text><text x='1075.0' y='198' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>sigmoid below -1.5:</text><text x='1075.0' y='215' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>2^-n P(f) in fp32,</text><text x='1075.0' y='232' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>Newton steps for 1/(1+e),</text><text x='1075.0' y='249' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>rounded to bf16</text><line x1='130' y1='215' x2='158' y2='215' stroke='#374151' stroke-width='1.6' marker-end='url(#ah)'/><line x1='350' y1='215' x2='378' y2='215' stroke='#374151' stroke-width='1.6' marker-end='url(#ah)'/><line x1='600' y1='215' x2='628' y2='215' stroke='#374151' stroke-width='1.6' marker-end='url(#ah)'/><line x1='830' y1='215' x2='858' y2='215' stroke='#374151' stroke-width='1.6' marker-end='url(#ah)'/><line x1='490' y1='338' x2='490' y2='282' stroke='#374151' stroke-width='1.6' marker-end='url(#ah)'/><line x1='400' y1='338' x2='255' y2='282' stroke='#374151' stroke-width='1.6' stroke-dasharray='5,4' marker-end='url(#ah)'/><path d='M 255 150 C 255 90, 1075 90, 1075 148' fill='none' stroke='#374151' stroke-width='1.6' stroke-dasharray='5,4' marker-end='url(#ah)'/><path d='M 1075 282 C 1075 320, 915 320, 915 262' fill='none' stroke='#374151' stroke-width='1.6' stroke-dasharray='5,4' marker-end='url(#ah)'/><text x='665' y='92' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>bf16 negative sigmoid past its set</text><text x='245' y='330' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>piece bounds</text><text x='150' y='480' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>host load path: coef_wr_i, coef_addr_i, coef_data_i</text><line x1='150' y1='466' x2='378' y2='420' stroke='#374151' stroke-width='1.6' stroke-dasharray='5,4' marker-end='url(#ah)'/></svg>